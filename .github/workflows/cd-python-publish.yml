name: CD - Publish release to PyPI

on:
  release:
    types: [published]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-uv-env

      - name: Build release distribution
        run: uv build

      - name: Check distribution contents
        run: uvx twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  release-publish:
    runs-on: ubuntu-latest
    needs: release-build
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      # Token auth works today. Once a Trusted Publisher is configured on
      # PyPI for this repo+workflow, drop `user`/`password` and the OIDC
      # id-token permission already declared above does the rest.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/
