name: "Setup uv environment"
description: "Sets up the uv environment for the project"

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python 3.14.3
      uses: actions/setup-python@v5
      with:
        python-version: "3.14.3"

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "0.13.1"
        enable-cache: true

    - name: Install dependencies
      shell: bash
      run: uv sync --frozen
