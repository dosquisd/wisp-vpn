[project]
name = "wisp-vpn"
version = "0.1.0"
description = "Wisp — ephemeral WireGuard VPNs on your own cloud"
readme = "README.md"
requires-python = ">=3.14"
authors = [
  { name="dosquisd", email="pereznjuandiego@gmail.com" },
  { name="SantiagoQP31", email="santiagoqp3103@gmail.com" },
]
dependencies = [
    "boto3>=1.43.83",
    "google-cloud-compute>=1.54.0",
    "oci>=2.100.0",
    "paramiko>=5.0.0",
    "platformdirs>=4.11.7",
    "pulumi>=3.0.0,<4.0.0",
    "pulumi-aws>=7.0.0,<8.0.0",
    "pulumi-gcp>=9.37.0",
    "pulumi-oci>=4.22.0",
    "pulumi-tls>=5.5.1",
    "pywin32>=312 ; sys_platform == 'win32'",
    "textual>=8.2.8",
    "tomli-w>=1.2.0",
    "tqdm>=4.70.0",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]
keywords = ["wireguard", "vpn", "ephemeral", "pulumi", "aws", "oci", "gcp", "tui"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/dosquisd/wisp-vpn"
Issues = "https://github.com/dosquisd/wisp-vpn/issues"

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
wisp = ["data/*.sh", "data/*.tpl", "data/wisp.socket"]

# Use `uv tool install --editable .`
[project.scripts]
wisp = "wisp.main:main"

[tool.uv]
package = true

[tool.ruff]
exclude = [".git", ".pytest_cache", ".venv"]
line-length = 88
indent-width = 4
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
fixable = ["ALL"]
extend-select = ["I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

# How to install the package from TestPyPI and PyPI:
# uv pip install --index-url https://test.pypi.org/simple/ \
#                --extra-index-url https://pypi.org/simple/ \
#                wisp-vpn
